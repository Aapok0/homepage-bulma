name: Image Scan

# Builds the php-fpm and nginx images locally (no push) and scans them with
# Trivy. Runs on PRs that touch the build, weekly to catch new base-image CVEs,
# and on demand.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '32 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: php
            target: runtime
          - suffix: nginx
            target: nginx-sidecar
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build ${{ matrix.suffix }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          tags: homepage-bulma-${{ matrix.suffix }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan ${{ matrix.suffix }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: homepage-bulma-${{ matrix.suffix }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
