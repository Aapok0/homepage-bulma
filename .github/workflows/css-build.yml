name: CSS build

on:
  pull_request:
    paths:
      - 'scss/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CSS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts: don't run (unneeded) dependency build scripts and don't
        # fail on ERR_PNPM_IGNORED_BUILDS; keeps deps consistent for the build below.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build main CSS
        run: pnpm run css-build

      - name: Upload CSS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: css
          path: css/main.css
          if-no-files-found: error
