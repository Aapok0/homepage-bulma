name: CSS build

on:
  push:
    branches:
      - main
    paths:
      - 'scss/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'scss/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  build:
    name: Build CSS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v4.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts: don't run (unneeded) dependency build scripts and don't
        # fail on ERR_PNPM_IGNORED_BUILDS; keeps deps consistent for the build below.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build main CSS
        run: pnpm run css-build

      - name: Upload CSS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: css
          path: css/main.css
          if-no-files-found: error
