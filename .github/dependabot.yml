version: 2
updates:
  - package-ecosystem: "npm" # Also updates pnpm
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Pin node to the 24 LTS line; allow minor/patch + digest updates.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Pin php to 8.3; allow patch + digest updates only.
      - dependency-name: "php"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
