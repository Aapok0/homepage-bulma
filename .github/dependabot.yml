version: 2
updates:
  - package-ecosystem: "npm" # Also updates pnpm
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
