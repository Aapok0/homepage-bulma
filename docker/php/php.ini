; Custom production overrides (layered on top of php.ini-production).
; Loaded from $PHP_INI_DIR/conf.d/ so it wins over the baseline php.ini.

; --- Core / security ---
expose_php = Off
cgi.fix_pathinfo = 0
date.timezone = UTC
memory_limit = 128M
max_execution_time = 30
post_max_size = 8M
upload_max_filesize = 2M

; --- Errors (log, never display, in production) ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Filesystem perf ---
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; --- OPcache ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; Immutable image: code never changes at runtime, so skip timestamp checks.
; Rebuild the image (or restart) to pick up new code.
opcache.validate_timestamps = 0
opcache.save_comments = 1

; --- JIT (optional; modest gain for I/O-bound web apps) ---
opcache.jit = tracing
opcache.jit_buffer_size = 64M
