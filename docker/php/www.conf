[www]
; user/group are omitted: the container already runs as the non-root app user,
; so php-fpm would ignore them and just log a NOTICE.

; Sidecar shares the replica's network namespace, so localhost is enough.
listen = 127.0.0.1:9000

; Pass container env vars (APP_ENV) through to PHP (php-fpm strips them otherwise).
clear_env = no

; Process manager tuned for a 0.25 vCPU / ~0.5 GiB (shared) envelope.
; ondemand: no idle workers; CPU is the bottleneck at 0.25 vCPU, so keep the
; worker count low — more workers can't run in parallel and just risk OOM.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Health endpoints for the ACA probe / nginx.
ping.path = /ping
ping.response = pong
pm.status_path = /status

; Send worker stdout/stderr to the container logs.
catch_workers_output = yes
decorate_workers_output = no
