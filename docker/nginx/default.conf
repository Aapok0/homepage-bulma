# nginx sidecar for the homepage app.
# Behind the Container Apps ingress: TLS is terminated upstream and forwarded as
# X-Forwarded-Proto, so we serve plain HTTP on :80 here (no SSL, no redirects).

server {
    # Unprivileged port: the container runs as a non-root user.
    listen 8080;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    server_tokens off;

    # Security headers (from the Ansible nginx setup). HSTS is omitted on purpose:
    # the ingress owns TLS. Set a CSP that matches the site's assets.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Never serve PHP includes / config sources directly.
    location ~ ^/(config|components|php)/ {
        deny all;
    }

    # Extensionless routing: real file, directory, then <name>.php.
    location / {
        try_files $uri $uri/ $uri.php?$query_string;
    }

    # Long-lived caching for static assets.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Hand PHP to the php-fpm sidecar over localhost (same replica).
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
